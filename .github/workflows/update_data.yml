name: Update App Data

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta cada hora
  workflow_dispatch:      # Permite ejecución manual

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Metadata
        env:
          GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          # Script para obtener info de cada APK usando el API de GitHub con Token
          
          get_info() {
            local repo=$1
            local path=$2
            local json_url=$3
            
            # Obtener Tamaño y Fecha usando el Token
            local file_data=$(curl -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$repo/contents/$path")
            local size_bytes=$(echo $file_data | jq -r '.size')
            local size_mb=$(echo "scale=1; $size_bytes / 1048576" | bc)
            
            local commit_data=$(curl -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$repo/commits?path=$path&per_page=1")
            local date_raw=$(echo $commit_data | jq -r '.[0].commit.committer.date')
            
            # Obtener Versión del JSON
            local version="..."
            if [ ! -z "$json_url" ]; then
              version=$(curl -sL $json_url | jq -r '.version // .versionName')
            fi
            
            echo "{\"version\": \"$version\", \"size\": \"$size_mb MB\", \"date\": \"$date_raw\"}"
          }

          # Recolectar de todos los proyectos
          STABLE=$(get_info "novaplaytv/updater" "novaplay.apk" "https://raw.githubusercontent.com/novaplaytv/updater/main/updatestable.json")
          BETA=$(get_info "novaplaytv/updater" "novaplaybeta.apk" "https://raw.githubusercontent.com/novaplaytv/updater/main/updatebeta.json")
          KILLER=$(get_info "novaplaytv/OtherProyects" "killertv/killertv.apk" "https://raw.githubusercontent.com/novaplaytv/OtherProyects/main/killertv/updates.json")

          # Guardar en un archivo JSON local
          echo "{\"stable\":$STABLE, \"beta\":$BETA, \"killer\":$KILLER, \"codecs\":$CODECS}" > app_data.json

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NovaStats Bot"
          git add app_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update: Sincronización de versiones y tamaños" && git push)
